<!-- Optional progressive enhancement: a proper Persian UI typeface.
     Loaded the async way (media="print" swapped to "all" on load) so it can
     NEVER block the page from rendering — on a network where this domain is
     slow or blocked outright, a plain <link rel="stylesheet"> would make the
     browser sit and wait before showing anything at all, which looks exactly
     like "the page won't open." This way the page always renders
     immediately with the system-font fallback, and only swaps to the nicer
     font if/when it actually finishes loading. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ==========================================================================
   PasarGuard Subscription Dashboard — stylesheet
   Design language: quiet dark glass, one signal color, state-driven glow.
   ========================================================================== */

:root {
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --gap: 16px;
  --shadow-soft: 0 12px 32px -12px rgba(0, 0, 0, 0.45);
  --dur-fast: 160ms;
  --dur-med: 340ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  --clr-signal: #33C7BD;      /* data / primary */
  --clr-signal-ink: #08201E;
  --clr-amber: #F0A63B;       /* time-remaining */
  --clr-danger: #EF5A72;      /* expired / critical */
  --clr-ok: #3ED694;          /* active status */
  --clr-hold: #8C93F0;        /* on-hold / unknown status */
}

[data-theme="dark"] {
  --bg-0: #080B10;
  --bg-1: #0E131A;
  --bg-grad-a: #0B121B;
  --bg-grad-b: #080A0E;
  --glass-fill: rgba(255, 255, 255, 0.045);
  --glass-fill-strong: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.09);
  --glass-border-strong: rgba(255, 255, 255, 0.16);
  --ink-1: #EEF2F6;
  --ink-2: #98A2B0;
  --ink-3: #5B6572;
  --track: rgba(255, 255, 255, 0.08);
  --overlay: rgba(4, 6, 9, 0.6);
  --input-bg: rgba(255, 255, 255, 0.06);
}

[data-theme="light"] {
  --bg-0: #EEF1F4;
  --bg-1: #F7F8FA;
  --bg-grad-a: #F2F4F7;
  --bg-grad-b: #E7EAEE;
  --glass-fill: rgba(255, 255, 255, 0.72);
  --glass-fill-strong: rgba(255, 255, 255, 0.92);
  --glass-border: rgba(15, 23, 32, 0.08);
  --glass-border-strong: rgba(15, 23, 32, 0.14);
  --ink-1: #131A21;
  --ink-2: #5B6572;
  --ink-3: #8B96A5;
  --track: rgba(15, 23, 32, 0.08);
  --overlay: rgba(20, 24, 30, 0.35);
  --input-bg: rgba(15, 23, 32, 0.045);
  --shadow-soft: 0 12px 32px -14px rgba(30, 40, 55, 0.22);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

html {
  background: var(--bg-0);
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--clr-signal) 14%, transparent), transparent 45%),
    radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--clr-amber) 10%, transparent), transparent 40%),
    linear-gradient(180deg, var(--bg-grad-a), var(--bg-grad-b) 70%);
  color: var(--ink-1);
  font-family: 'Vazirmatn', 'Segoe UI', Tahoma, 'Iranian Sans', system-ui, -apple-system, sans-serif;
  font-feature-settings: "ss01" on;
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
  transition: background-color var(--dur-med) var(--ease), color var(--dur-med) var(--ease);
  padding-bottom: 96px; /* room for the sticky quick-add bar */
}

html[dir="rtl"] body { direction: rtl; }
html[dir="ltr"] body { direction: ltr; }

:focus-visible {
  outline: 2px solid var(--clr-signal);
  outline-offset: 2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

button { font-family: inherit; }

.app-shell {
  max-width: 560px;
  margin: 0 auto;
  padding: 18px 16px 12px;
}

/* ---------------- Topbar ---------------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  background: linear-gradient(155deg, color-mix(in srgb, var(--clr-signal) 30%, transparent), transparent);
  border: 1px solid var(--glass-border);
  flex-shrink: 0;
  overflow: hidden;
}
.brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }

.brand-name {
  font-weight: 700;
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--glass-fill);
  color: var(--ink-1);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.icon-btn:hover { background: var(--glass-fill-strong); border-color: var(--glass-border-strong); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------------- Announcement ---------------- */
.announce {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--clr-amber) 14%, var(--glass-fill));
  border: 1px solid color-mix(in srgb, var(--clr-amber) 28%, var(--glass-border));
  margin-bottom: 14px;
  font-size: 13.5px;
  animation: slide-in var(--dur-med) var(--ease);
}
.announce a { color: var(--ink-1); font-weight: 700; text-decoration: underline; }
.announce-text { flex: 1; min-width: 0; }

/* ---------------- Glass card base ---------------- */
.card {
  position: relative;
  background: var(--glass-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: var(--shadow-soft);
  padding: 18px;
  margin-bottom: 14px;
  animation: rise-in var(--dur-med) var(--ease) both;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------------- Status badge ---------------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px 5px 10px;
  border-radius: var(--radius-pill);
  font-size: 12.5px;
  font-weight: 700;
  background: color-mix(in srgb, var(--badge-c) 16%, transparent);
  color: var(--badge-c);
  border: 1px solid color-mix(in srgb, var(--badge-c) 34%, transparent);
}
html[dir="rtl"] .badge { padding: 5px 10px 5px 12px; }
.badge::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--badge-c);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--badge-c) 25%, transparent);
}
.badge.is-active { --badge-c: var(--clr-ok); }
.badge.is-limited { --badge-c: var(--clr-amber); }
.badge.is-expired { --badge-c: var(--clr-danger); }
.badge.is-hold, .badge.is-unknown { --badge-c: var(--clr-hold); }

/* ---------------- Rings ---------------- */
.rings-row {
  display: flex;
  justify-content: center;
  gap: 28px;
  padding: 6px 0 18px;
  flex-wrap: wrap;
}

.ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 148px;
}

.ring-svg-box {
  position: relative;
  width: 128px;
  height: 128px;
}
.ring-svg-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--track); stroke-width: 10; }
.ring-progress {
  fill: none;
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset 900ms var(--ease), stroke 400ms var(--ease);
}
.ring-glow {
  fill: none;
  stroke-width: 16;
  stroke-linecap: round;
  opacity: 0.35;
  filter: blur(7px);
  transition: stroke-dashoffset 900ms var(--ease), stroke 400ms var(--ease);
}
.ring-wrap[data-severity="warn"] .ring-glow,
.ring-wrap[data-severity="danger"] .ring-glow {
  animation: pulse-glow 2.6s ease-in-out infinite;
}

.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.ring-value {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.ring-unit { font-size: 11px; color: var(--ink-2); font-weight: 600; margin-top: 1px; }
.ring-sublabel { font-size: 9.5px; color: var(--ink-3); font-weight: 600; margin-top: 1px; letter-spacing: 0.01em; min-height: 12px; }
.ring-caption { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }

/* ---------------- Meta row (expiry / plan) ---------------- */
.meta-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.meta-item { text-align: center; flex: 1; min-width: 110px; }
.meta-item + .meta-item { border-inline-start: 1px solid var(--glass-border); }
.meta-label { font-size: 11.5px; color: var(--ink-2); margin-bottom: 3px; }
.meta-value { font-size: 13.5px; font-weight: 700; cursor: default; }

/* ---------------- Buttons ---------------- */
.actions-row { display: flex; gap: 10px; }

.btn {
  border: none;
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform var(--dur-fast) var(--ease), filter var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn svg { width: 17px; height: 17px; flex-shrink: 0; }

.btn-primary {
  background: linear-gradient(155deg, var(--clr-signal), color-mix(in srgb, var(--clr-signal) 70%, #0a7d76));
  color: var(--clr-signal-ink);
  flex: 0 0 auto;
}
.btn-primary:hover { filter: brightness(1.08); }

.btn-outline {
  background: var(--glass-fill);
  border: 1px solid var(--glass-border-strong);
  color: var(--ink-1);
  flex: 1;
  backdrop-filter: blur(10px);
}
.btn-outline:hover { background: var(--glass-fill-strong); }

.btn-square {
  width: 46px;
  height: 46px;
  padding: 0;
  flex: 0 0 auto;
  background: var(--glass-fill);
  border: 1px solid var(--glass-border-strong);
  color: var(--ink-1);
}
.btn-square:hover { background: var(--glass-fill-strong); }

.btn-copied { background: color-mix(in srgb, var(--clr-ok) 22%, var(--glass-fill)) !important; border-color: color-mix(in srgb, var(--clr-ok) 45%, transparent) !important; }

/* ---------------- Server list ---------------- */
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--input-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 12px;
}
.search-box svg { width: 16px; height: 16px; color: var(--ink-2); flex-shrink: 0; }
.search-box input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  color: var(--ink-1);
  font-size: 13.5px;
  font-family: inherit;
  min-width: 0;
}
.search-box input::placeholder { color: var(--ink-3); }

.server-list { display: flex; flex-direction: column; gap: 8px; }

.server-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  border: 1px solid transparent;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.server-row:hover { background: var(--glass-fill-strong); border-color: var(--glass-border); }

.server-flag { font-size: 20px; flex-shrink: 0; width: 24px; text-align: center; }
.server-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--clr-ok); flex-shrink: 0;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--clr-ok) 20%, transparent);
}
.server-info { flex: 1; min-width: 0; }
.server-name {
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.server-sub { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }

.proto-chip {
  font-size: 10.5px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--clr-signal) 18%, transparent);
  color: var(--clr-signal);
  border: 1px solid color-mix(in srgb, var(--clr-signal) 32%, transparent);
  flex-shrink: 0;
  letter-spacing: 0.02em;
}

.row-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn-sm {
  width: 30px; height: 30px;
  border-radius: 9px;
  border: none;
  background: transparent;
  color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.icon-btn-sm:hover { background: var(--glass-fill-strong); color: var(--ink-1); }
.icon-btn-sm svg { width: 15px; height: 15px; }

.server-details {
  font-size: 11.5px;
  color: var(--ink-2);
  padding: 8px 12px 2px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
  direction: ltr;
  text-align: left;
}
.server-details b { color: var(--ink-1); font-weight: 600; }

.empty-note {
  text-align: center;
  color: var(--ink-2);
  font-size: 13px;
  padding: 24px 10px;
}

/* ---------------- Quick add apps ---------------- */
.quickadd-inline { margin-top: 2px; }
.quickadd-title { font-size: 12.5px; color: var(--ink-2); margin-bottom: 10px; font-weight: 600; }
.app-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.app-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 14px;
  border-radius: var(--radius-pill);
  background: var(--input-bg);
  border: 1px solid var(--glass-border);
  color: var(--ink-1);
  font-size: 12.5px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  text-decoration: none;
}
.app-chip:hover { background: var(--glass-fill-strong); border-color: var(--glass-border-strong); }
.app-chip:active { transform: scale(0.96); }
.app-chip .app-icon { font-size: 15px; line-height: 1; }
.app-chip.is-disabled { opacity: 0.4; cursor: not-allowed; }
.app-chip.is-disabled:hover { background: var(--input-bg); border-color: var(--glass-border); }
.app-chip.is-disabled:active { transform: none; }

/* ---------------- Footer / support row ---------------- */
.support-row { display: flex; gap: 8px; margin-top: 4px; }
.support-btn {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 10px;
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  border: 1px solid var(--glass-border);
  color: var(--ink-1);
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease);
}
.support-btn:hover { background: var(--glass-fill-strong); }
.support-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.footnote {
  text-align: center;
  font-size: 11px;
  color: var(--ink-3);
  padding: 18px 10px 6px;
}
.footnote-line {
  margin-bottom: 6px;
}
.footnote-credit {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-2);
  text-decoration: none;
  font-weight: 700;
  transition: color var(--dur-fast) var(--ease);
}
.footnote-credit:hover { color: var(--ink-1); }
.footnote-gh-icon { width: 14px; height: 14px; flex-shrink: 0; }

/* ---------------- Modal ---------------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-med) var(--ease);
}
.modal-overlay.is-open { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--bg-1);
  border: 1px solid var(--glass-border-strong);
  border-radius: var(--radius-lg);
  padding: 22px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-soft);
  transform: scale(0.92) translateY(10px);
  transition: transform var(--dur-med) var(--ease);
}
.modal-overlay.is-open .modal { transform: scale(1) translateY(0); }

.modal-title { font-weight: 700; font-size: 14.5px; margin-bottom: 14px; }
.qr-box {
  background: #fff;
  border-radius: var(--radius-md);
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 220px;
  margin-bottom: 14px;
}
.qr-box img, .qr-box canvas { width: 100%; height: auto; display: block; }
.qr-fallback-note { font-size: 12px; color: var(--ink-2); padding: 10px; }
.modal-close {
  width: 100%;
  padding: 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border-strong);
  background: var(--glass-fill);
  color: var(--ink-1);
  font-weight: 700;
  font-size: 13.5px;
  cursor: pointer;
}

/* ---------------- Toast ---------------- */
.toast {
  position: fixed;
  bottom: 92px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--bg-1);
  border: 1px solid var(--glass-border-strong);
  color: var(--ink-1);
  padding: 11px 20px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--shadow-soft);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-med) var(--ease), transform var(--dur-med) var(--ease);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.toast.is-open { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { width: 15px; height: 15px; color: var(--clr-ok); }

/* ---------------- Loading / error states ---------------- */
.skeleton {
  background: linear-gradient(100deg, var(--track) 30%, var(--glass-fill-strong) 50%, var(--track) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.6s ease-in-out infinite;
  border-radius: var(--radius-sm);
}
.state-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--clr-danger) 12%, var(--glass-fill));
  border: 1px solid color-mix(in srgb, var(--clr-danger) 26%, var(--glass-border));

}

.hidden { display: none !important; }

/* ---------------- Sticky bottom quick-add (mobile app-like) ---------------- */
.sticky-quickadd {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: color-mix(in srgb, var(--bg-1) 92%, transparent);
  border-top: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

.sticky-quickadd .quickadd-title { display: none; }
.sticky-quickadd .app-chip { flex-shrink: 0; }

@media (min-width: 640px) {
  .sticky-quickadd { display: none; } /* on wider screens the inline card in the flow is enough */
}
@media (max-width: 639px) {
  .quickadd-inline { display: none; } /* avoid duplicating on mobile, sticky bar takes over */

@keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

@keyframes pulse-glow { 0%, 100% { opacity: 0.28; } 50% { opacity: 0.55; } }

      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (e2) { return false; }
  }
}

function guessFlag(remark) {
  if (!remark) return '🌐';
  if (/^[\u{1F1E6}-\u{1F1FF}]{2}/u.test(remark)) return remark.match(/^[\u{1F1E6}-\u{1F1FF}]{2}/u)[0];
  const lower = remark.toLowerCase();
  for (const key in COUNTRY_FLAGS) {
    if (key.length <= 2) {
      if (new RegExp('(^|[^a-zA-Z])' + key + '([^a-zA-Z]|$)', 'i').test(remark)) return COUNTRY_FLAGS[key];
    } else if (lower.includes(key)) {
      return COUNTRY_FLAGS[key];
    }
  }
  return '🌐';
}


/* ===================== 5) Proxy URI parsing (per-config) =================== */
function parseVmess(uriStr) {
  try {
    const json = JSON.parse(b64DecodeUtf8(uriStr.slice('vmess://'.length)));
    return {
      protocol: 'VMess', remark: json.ps || 'VMess',
      address: json.add || '', port: json.port || '',
      params: { network: json.net || '', security: json.tls || 'none', sni: json.sni || json.host || '' },
      raw: uriStr,
    };
  } catch (e) {
    return { protocol: 'VMess', remark: 'VMess', address: '', port: '', params: {}, raw: uriStr };
  }
}
function parseGenericUri(uriStr) {
  const knownProtocols = {
    'vless:': 'VLESS', 'trojan:': 'Trojan', 'ss:': 'Shadowsocks', 'ssr:': 'ShadowsocksR',
    'hysteria2:': 'Hysteria2', 'hy2:': 'Hysteria2', 'hysteria:': 'Hysteria', 'tuic:': 'TUIC',
    'wireguard:': 'WireGuard', 'socks:': 'SOCKS5', 'socks5:': 'SOCKS5',
  };
  try {
    const u = new URL(uriStr);
    const protocol = knownProtocols[u.protocol] || u.protocol.replace(':', '').toUpperCase();
    let remark = '';
    try { remark = u.hash ? decodeURIComponent(u.hash.slice(1)) : ''; } catch (e) { remark = u.hash.slice(1); }
    const params = {};
    u.searchParams.forEach((v, k) => { params[k] = v; });
    let address = u.hostname, port = u.port;
    // Shadowsocks has two link shapes: SIP002 (`base64(method:pass)@host:port`,
    // host/port already plain) and legacy (`base64(method:pass@host:port)`,
    // the whole authority is encoded). Detect which by checking for a
    // literal "@" before any query/fragment — SIP002 always has one.
    if (protocol === 'Shadowsocks') {
      const beforeHashQuery = uriStr.slice('ss://'.length).split(/[?#]/)[0];
      if (!beforeHashQuery.includes('@')) {
        try {
          const decoded = b64DecodeUtf8(beforeHashQuery);
          const m = decoded.match(/^(.*):(.*)@([^:]+):(\d+)$/);
          if (m) { address = m[3]; port = m[4]; }
        } catch (e) { /* leave as parsed */ }
      }
    }
    return { protocol, remark: remark || protocol, address, port, params, raw: uriStr };
  } catch (e) {
    return { protocol: 'Config', remark: 'Config', address: '', port: '', params: {}, raw: uriStr };
  }
}
function parseProxyUri(line) {
  if (line.startsWith('vmess://')) return parseVmess(line);
  return parseGenericUri(line);
}
function parseConfigList(bodyText) {
  let decoded = bodyText.trim();
  if (looksLikeBase64(decoded)) {
    try { decoded = b64DecodeUtf8(decoded); } catch (e) { /* wasn't base64, use as-is */ }
  }
  return decoded.split(/\r?\n/).map((l) => l.trim()).filter((l) => l && l.includes('://')).map(parseProxyUri);
}

    { protocol: 'Trojan', remark: 'ترکیه - استانبول', address: 'tr1.example.com', port: '443', params: { network: 'tcp', security: 'tls', sni: 'example.com' }, raw: '' },
  ],

function isPreviewContext() {
  const params = new URLSearchParams(location.search);
  if (params.get('sub')) return false; // explicit override: try to actually fetch it
  return location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
}
function resolveSubUrl() {
  const params = new URLSearchParams(location.search);
  return params.get('sub') || location.href;
}

function tryReadInjectedData() {
  try {
    const d = window.__INITIAL_DATA__;
    if (!d || typeof d !== 'object' || d.__isTemplateSample) return null;
    return d;
  } catch (e) { return null; }
}

// PasarGuard's own custom-template contract (confirmed from the official
// template's source) injects `window.__INITIAL_DATA__.user.status` as a
// plain string ('active' | 'on_hold' | 'limited' | 'expired' | 'disabled')
// — the exact panel-side status, not a guess. Same for `.apps`: an array
// the ADMIN configures in PasarGuard's own Settings → Subscription →
// Applications screen, so if it's present we use *that* instead of our own
// guesses — it's already whatever the admin has tested and knows works.
function parseInjectedUser(injected) {
  try {
    const u = injected && injected.user;
    if (!u || typeof u !== 'object') return null;
    // Field name isn't confirmed for this one (PasarGuard added HWID-limit
    // subscription hints recently and the exact injected shape wasn't
    // available to check) — try the plausible spellings, use whichever
    // actually resolves to a number, and leave it out entirely otherwise.
    const hwidRaw = ['hwid_limit', 'hwidLimit', 'device_limit', 'max_devices']
      .map((k) => u[k]).find((v) => v !== undefined && v !== null && !isNaN(Number(v)));
    return {
      username: u.username || '',
      status: typeof u.status === 'string' ? u.status : '',
      supportUrl: (u.admin && u.admin.support_url) || '',
      hwidLimit: hwidRaw !== undefined ? Number(hwidRaw) : null,
    };
  } catch (e) { return null; }
}
function parseInjectedApps(injected) {
  try {
    const list = injected && injected.apps;
    if (!Array.isArray(list) || list.length === 0) return null;
    const apps = list
      .filter((a) => a && a.import_url)
      .map((a) => ({
        name: a.name || 'App',
        iconUrl: a.icon_url || '',
        importUrl: a.import_url,
        platforms: a.platform ? [String(a.platform).toLowerCase()] : [],
        recommended: !!a.recommended,
        mode: 'deeplink',
      }));
    return apps.length ? apps : null;
  } catch (e) { return null; }
}

function parseUsernameFromDisposition(disposition) {
  if (!disposition) return '';
  const m = disposition.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
  if (!m) return '';
  let name = m[1];
  try { name = decodeURIComponent(name); } catch (e) { /* leave as-is */ }
  return name;
}

async function fetchRawSubscription(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), CONFIG.behavior.fetchTimeoutMs);
  try {
    const res = await fetch(url, {
      headers: { Accept: 'text/plain, application/json;q=0.9, */*;q=0.8' },
      cache: 'no-store',
      signal: controller.signal,
    });
    clearTimeout(timeout);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const contentType = (res.headers.get('content-type') || '').toLowerCase();
    if (contentType.includes('text/html')) {
      // The panel (or whatever is actually serving this URL) ignored our
      // Accept header and gave back HTML instead of raw subscription data
      // — parsing that as a config list would just produce garbage rows.
      // Treat it the same as any other failure to get raw data.
      throw new Error('got HTML instead of raw subscription data');
    }
    const userinfoRaw = res.headers.get('subscription-userinfo');
    const userinfo = {};
    if (userinfoRaw) {
      userinfoRaw.split(';').forEach((part) => {
        const [k, v] = part.trim().split('=');
        if (k && v !== undefined) userinfo[k.trim()] = Number(v.trim());
      });
    }
    let profileTitle = res.headers.get('profile-title') || '';
    try { profileTitle = decodeURIComponent(profileTitle); } catch (e) { /* leave as-is */ }
    const username = parseUsernameFromDisposition(res.headers.get('content-disposition') || '');
    // Same situation as above: no confirmed header name for this, so a
    // small set of plausible ones (matching PasarGuard's own naming
    // convention for its other subscription headers) get tried; if none of
    // them are present the field just stays null and nothing is shown.
    const hwidHeaderNames = ['hwid-limit', 'subscription-hwid-limit', 'x-hwid-limit', 'hwid-device-limit'];
    let hwidLimit = null;
    for (const name of hwidHeaderNames) {
      const v = res.headers.get(name);
      if (v !== null && v !== '' && !isNaN(Number(v))) { hwidLimit = Number(v); break; }
    }
    const bodyText = await res.text();
    const configs = parseConfigList(bodyText);
    return {
      upload: userinfo.upload || 0, download: userinfo.download || 0,
      total: userinfo.total || 0, expire: userinfo.expire || 0,
      profileTitle, username, hwidLimit, supportUrl: res.headers.get('support-url') || '',
      webPageUrl: res.headers.get('profile-web-page-url') || '',
      configs, hadUserinfo: !!userinfoRaw,
    };
  } catch (e) {
    clearTimeout(timeout);
    throw e;
  }
}

// Fallback heuristic for when the panel doesn't (or can't) tell us the
// exact status directly: a account with no expiry AND zero usage yet has
// most likely not had its countdown started (on_hold) rather than
// genuinely being unlimited — once they connect at least once, expire
// either gets set for real or it truly is unlimited.
function deriveStatus(upload, download, total, expire) {
  const now = Math.floor(Date.now() / 1000);
  const hasUsage = (upload + download) > 0;
  if (expire && expire > 0 && expire < now) return 'expired';
  if (total && total > 0 && upload + download >= total) return 'limited';
  if ((!expire || expire <= 0) && !hasUsage) return 'on_hold';
  return 'active';
}
function resolveStatus(injectedUser, upload, download, total, expire) {
  const known = ['active', 'on_hold', 'limited', 'expired', 'disabled'];
  if (injectedUser && known.includes(injectedUser.status)) return injectedUser.status;
  return deriveStatus(upload, download, total, expire);
}

async function loadSubscriptionData() {
  const subUrl = resolveSubUrl();
  const injected = tryReadInjectedData();
  const injectedUser = parseInjectedUser(injected);
  const injectedApps = parseInjectedApps(injected);

  if (isPreviewContext()) {
    return Object.assign({}, SAMPLE_DATA, { subUrl, isSample: true, apps: injectedApps });
  }

  try {
    const raw = await fetchRawSubscription(subUrl);
    if (!raw.hadUserinfo && raw.configs.length === 0) throw new Error('empty response');
    const status = resolveStatus(injectedUser, raw.upload, raw.download, raw.total, raw.expire);
    const hwidLimit = (injectedUser && injectedUser.hwidLimit !== null && injectedUser.hwidLimit !== undefined)
      ? injectedUser.hwidLimit
      : raw.hwidLimit;
    return {
      isSample: false,
      username: raw.username || (injectedUser && injectedUser.username) || '',
      status, hwidLimit,
      upload: raw.upload, download: raw.download, total: raw.total, expire: raw.expire,
      supportUrl: raw.supportUrl || (injectedUser && injectedUser.supportUrl) || '',
      subUrl, configs: raw.configs, apps: injectedApps,
    };
  } catch (e) {
    console.warn('[sub-template] could not fetch live subscription data, showing sample data:', e);
    return Object.assign({}, SAMPLE_DATA, { subUrl, isSample: true, loadFailed: true, apps: injectedApps });
  }
}

function ringMarkup(id, colorVar, severity) {
  const r = 54, c = 2 * Math.PI * r;
  return `

      <div class="ring-svg-box">
        <svg viewBox="0 0 128 128">

        </svg>

          <div class="ring-value" id="${id}Value">–</div>

        </div>
      </div>

    </div>`;
}

function setRing(id, fraction, severity) {
  const r = 54, c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, fraction));
  const offset = c * (1 - clamped);
  requestAnimationFrame(() => {
    el('#' + id + 'Progress').style.strokeDashoffset = offset;
    el('#' + id + 'Glow').style.strokeDashoffset = offset;
  });
  el('#' + id + 'Progress').parentElement.parentElement.parentElement.dataset.severity = severity;
}

function ensureRingShells() {
  const row = el('#ringsRow');
  if (row && !row.dataset.built) {
    row.innerHTML = ringMarkup('dataRing', 'var(--clr-signal)', 'ok') + ringMarkup('timeRing', 'var(--clr-amber)', 'ok');
    row.dataset.built = '1';
  }
}

function renderRings(data) {
  ensureRingShells();
  const now = Math.floor(Date.now() / 1000);
  const used = (data.upload || 0) + (data.download || 0);
  const total = data.total || 0;

  // Data ring
  if (total > 0) {
    const frac = Math.min(used / total, 1);
    const sev = frac >= 1 ? 'danger' : (frac >= CONFIG.behavior.warnUsagePercent / 100 ? 'warn' : 'ok');
    setRing('dataRing', frac, sev);
    const remain = Math.max(total - used, 0);
    el('#dataRingValue').textContent = formatBytes(remain).split(' ')[0];
    el('#dataRingUnit').textContent = formatBytes(remain).split(' ').slice(1).join(' ');
    el('#dataRingSublabel').textContent = t('remaining');
  } else {
    setRing('dataRing', 0.06, 'ok');
    el('#dataRingValue').textContent = '∞';
    el('#dataRingUnit').textContent = t('unlimited');
    el('#dataRingSublabel').textContent = '';
  }
  el('#dataRingCaption').textContent = t('dataUsage');

  // Time ring. We only ever get an absolute expiry timestamp back from the
  // panel, never "how many days was this plan for" — so the fill fraction
  // is deliberately just an urgency cue against a fixed reference window
  // (most resold plans are monthly), not a precise "% of plan consumed".
  if (data.status === 'on_hold') {
    // Countdown hasn't started yet — expire=0 here means "not decided",
    // not "unlimited", so this gets its own calm/neutral look rather than
    // the infinity symbol used for genuinely no-expiry plans.
    setRing('timeRing', 0.04, 'ok');
    el('#timeRingValue').textContent = '⏳';
    el('#timeRingUnit').textContent = t('pending');
    el('#timeRingSublabel').textContent = '';
  } else if (data.expire && data.expire > 0) {
    const daysLeft = Math.max(daysBetween(now, data.expire), 0);
    const frac = 1 - Math.min(daysLeft / CONFIG.behavior.ringReferenceDays, 1);
    const sev = daysLeft <= 0 ? 'danger' : (daysLeft <= CONFIG.behavior.warnDaysLeft ? 'warn' : 'ok');
    setRing('timeRing', frac, sev);
    el('#timeRingValue').textContent = localizeDigits(daysLeft);
    el('#timeRingUnit').textContent = t('daysUnit');
    el('#timeRingSublabel').textContent = t('remaining');
  } else {
    setRing('timeRing', 0.06, 'ok');
    el('#timeRingValue').textContent = '∞';
    el('#timeRingUnit').textContent = t('noExpiry');
    el('#timeRingSublabel').textContent = '';
  }
  el('#timeRingCaption').textContent = t('timeLeft');
}

      </div>
    </div>
    <div class="server-details hidden" id="details-${idx}"></div>`;
}
function detailsMarkup(cfg) {
  const rows = [];
  if (cfg.address) rows.push([t('address'), cfg.address]);
  if (cfg.port) rows.push([t('port'), cfg.port]);
  if (cfg.params) {
    if (cfg.params.network) rows.push([t('network'), cfg.params.network]);
    if (cfg.params.security) rows.push([t('security'), cfg.params.security]);
    if (cfg.params.sni) rows.push([t('sni'), cfg.params.sni]);
  }
  return rows.map(([k, v]) => `<div>${escapeHtml(k)}</div><div><b>${escapeHtml(String(v))}</b></div>`).join('');
}

function renderServerList(data) {
  el('#serversTitle').textContent = t('availableServers');
  el('#serverSearch').placeholder = t('searchPlaceholder');
  el('#copyAllBtn').querySelector('span').textContent = t('copyAllConfigs');
  el('#copyAllBtn').classList.toggle('hidden', data.configs.length === 0);
  const q = searchQuery.trim().toLowerCase();
  const filtered = data.configs
    .map((c, i) => ({ c, i }))
    .filter(({ c }) => !q || c.remark.toLowerCase().includes(q) || c.protocol.toLowerCase().includes(q) || (c.address || '').toLowerCase().includes(q));

  const list = el('#serverList');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-note">${t('noResults')}</div>`;
    return;
  }
  list.innerHTML = filtered.map(({ c, i }) => serverRowMarkup(c, i)).join('');
}

function detectPlatform() {
  const ua = navigator.userAgent || '';
  const platform = navigator.platform || '';
  if (/iPhone|iPad|iPod/.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  if (/Macintosh|Mac OS X/.test(ua)) return 'macos';
  if (/Win/.test(platform)) return 'windows';
  if (/Linux/.test(platform)) return 'linux';
  return 'other';
}

function getEffectiveApps(data) {
  // Prefer whatever the panel itself provides (admin-configured in
  // PasarGuard's own Settings → Subscription → Applications) — that's
  // already tested against real devices by the admin. Only fall back to
  // our own curated list when the panel doesn't supply one.
  if (data.apps && data.apps.length) {
    return data.apps.slice().sort((a, b) => (b.recommended ? 1 : 0) - (a.recommended ? 1 : 0));
  }
  return CONFIG.apps;
}

function renderQuickAdd(data) {
  const platform = detectPlatform();
  const apps = getEffectiveApps(data);
  const chipHtml = (app, idx) => {
    const iconHtml = app.iconUrl
      ? `<img src="${escapeHtml(app.iconUrl)}" alt="" style="width:15px;height:15px;border-radius:4px;object-fit:cover;flex-shrink:0;">`
      : `<span class="app-icon">${app.icon || '📱'}</span>`;
    const isMatch = app.platforms.includes(platform);
    if (!isMatch) {
      return `<button class="app-chip is-disabled" type="button" disabled aria-disabled="true">${iconHtml}${escapeHtml(app.name)}</button>`;
    }
    const btnClass = app.mode === 'clipboard' ? 'js-app-clipboard' : 'js-app-deeplink';
    return `<button class="app-chip ${btnClass}" type="button" data-app-index="${idx}">${iconHtml}${escapeHtml(app.name)}</button>`;
  };
  const html = apps.map(chipHtml).join('');
  els('.app-row').forEach((row) => { row.innerHTML = html; });
  els('.quickadd-title').forEach((n) => { n.textContent = t('quickAdd'); });
}

// Attempts to open an already-installed app via a custom URL scheme. If the
// page is still visible a couple seconds later, nothing took over the
// screen, so the app is very likely not installed — the caller's onFail
// runs in that case instead of silently doing nothing.
function tryOpenApp(url, onFail) {
  let settled = false;
  const finish = (installed) => {
    if (settled) return;
    settled = true;
    document.removeEventListener('visibilitychange', onVisibility);
    if (!installed) onFail();
  };
  const onVisibility = () => { if (document.hidden) finish(true); };
  document.addEventListener('visibilitychange', onVisibility);
  window.location.href = url;
  setTimeout(() => finish(false), 1800);
}

function renderSupportRow() {
  const mk = (href, icon, label) => href
    ? `<a class="support-btn" href="${escapeHtml(href)}" target="_blank" rel="noopener">${icon}${escapeHtml(label)}</a>`
    : '';
  const toUrl = (v) => (!v ? '' : /^https?:\/\//.test(v) ? v : 'https://t.me/' + v.replace(/^@/, ''));
  const parts = [
    mk(toUrl(CONFIG.links.renew), ICONS.renew, t('buyRenew')),
    mk(toUrl(CONFIG.links.channel), ICONS.channel, t('channel')),
    mk(toUrl(CONFIG.links.support), ICONS.support, t('support')),
  ].filter(Boolean);
  el('#supportRow').innerHTML = parts.join('');
  el('#supportRow').classList.toggle('hidden', parts.length === 0);
}

function renderAnnouncement() {
  const box = el('#announceBox');
  const text = CONFIG.announcement.enabled && (CONFIG.announcement.text[lang] || CONFIG.announcement.text.fa);
  if (!text) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const linkHtml = CONFIG.announcement.url ? ` <a href="${escapeHtml(CONFIG.announcement.url)}" target="_blank" rel="noopener">${lang === 'fa' ? 'بیشتر' : 'more'}</a>` : '';
  el('#announceBox .announce-text').innerHTML = escapeHtml(text) + linkHtml;
}

function renderBrand(data) {
  // Per-user name from the panel (e.g. "ali") takes priority over the
  // generic configured brand name — that only shows before data has
  // loaded, or as a fallback if the panel didn't provide a username.
  const name = (data && data.username) || CONFIG.brand.name || 'PasarGuard';
  el('#brandName').textContent = name;
  const mark = el('#brandMark');
  if (CONFIG.brand.logoUrl) mark.innerHTML = `<img src="${escapeHtml(CONFIG.brand.logoUrl)}" alt="">`;
  else mark.textContent = CONFIG.brand.logoEmoji || '🛡️';
  document.title = name + ' — ' + t('subStatus');
}

function renderFooter() {
  el('#footnoteSecurity').textContent = '🔒 ' + t('encryptedNote');
  el('#footnoteCreditText').textContent = CONFIG.brand.credit || '';
  el('#footnoteCredit').href = CONFIG.brand.creditUrl || '#';
}

function renderModalStrings() {
  el('#qrModalTitle').textContent = t('scanQr');
  el('#qrModalClose').textContent = t('close');
}

function renderPreviewNote(data) {
  const showAsPreview = data.isSample && !data.loadFailed;
  el('#previewNote').classList.toggle('hidden', !showAsPreview);
  el('#previewNote').textContent = t('previewNote');
}

function renderErrorBanner(data) {
  const banner = el('#errorBanner');
  if (!data.loadFailed) { banner.classList.add('hidden'); return; }
  banner.classList.remove('hidden');
  banner.querySelector('.state-title').textContent = t('loadErrorTitle');
  banner.querySelector('.state-body').textContent = t('loadErrorBody');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderAll(data) {
  document.documentElement.lang = lang === 'fa' ? 'fa' : 'en';
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  el('#cardStatusLabel').textContent = t('subStatus');
  renderBrand(data);
  renderErrorBanner(data);
  renderAnnouncement();
  renderStatusBadge(data.status);
  renderRings(data);
  renderMeta(data);
  renderActions(data);
  renderServerList(data);
  renderQuickAdd(data);
  renderSupportRow();
  renderFooter();
  renderPreviewNote(data);
  renderModalStrings();
}


/* ============================== 8) Interactions ============================= */
const ICONS = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M14 21h1M21 21v-3M17.5 17.5h.01M21 14h.01"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  renew: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>',
  channel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
  support: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a10 10 0 100-20 10 10 0 000 20zM12 16v-1a3 3 0 113-3"/><path d="M12 8h.01"/></svg>',
};

function showToast(msg) {
  const toast = el('#toast');
  toast.querySelector('span').textContent = msg;
  toast.classList.add('is-open');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('is-open'), 1800);
}

function openQrModal(text) {
  const modal = el('#qrModal');
  const box = el('#qrBox');
  box.innerHTML = '<div class="qr-fallback-note">…</div>';
  modal.classList.add('is-open');
  ensureQrLib()
    .then((QR) => {
      box.innerHTML = '';
      try {
        // eslint-disable-next-line no-new
        new QR(box, { text, width: 240, height: 240, correctLevel: QR.CorrectLevel.M });
      } catch (e) {
        box.innerHTML = `<div class="qr-fallback-note">${escapeHtml(text)}</div>`;
      }
    })
    .catch(() => {
      box.innerHTML = `<div class="qr-fallback-note">${lang === 'fa' ? 'بارگذاری QR ممکن نشد؛ می‌توانید لینک را کپی کنید.' : 'Could not load the QR library — you can still copy the link.'}</div>`;
    });
}
function closeQrModal() { el('#qrModal').classList.remove('is-open'); }

let qrLibPromise = null;
function ensureQrLib() {
  if (window.QRCode) return Promise.resolve(window.QRCode);
  if (qrLibPromise) return qrLibPromise;
  qrLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    // A blocked/filtered network sometimes silently stalls a request instead
    // of cleanly failing it (neither onload nor onerror ever fires) — this
    // timeout is what guarantees the QR modal still shows a fallback message
    // instead of spinning forever. This only affects the QR button itself;
    // it's loaded lazily on click, never on initial page load.
    const timer = setTimeout(() => reject(new Error('QR script load timed out')), 6000);
    s.onload = () => { clearTimeout(timer); window.QRCode ? resolve(window.QRCode) : reject(new Error('QRCode missing after load')); };
    s.onerror = () => { clearTimeout(timer); reject(new Error('QR script failed to load')); };
    document.head.appendChild(s);
  });
  return qrLibPromise;
}

function wireEvents(data) {
  el('#themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });
  el('#langToggle').addEventListener('click', () => applyLanguage(lang === 'fa' ? 'en' : 'fa'));

  // Delegated (not a direct id lookup) because the quick-add app row is
  // rendered twice — once inline, once in the sticky mobile bar — and only
  // one of the two is visible at a given viewport width via CSS. Attaching
  // to a single element by id would silently miss clicks on whichever copy
  // CSS is actually showing.
  document.addEventListener('click', async (e) => {
    const clipBtn = e.target.closest('.js-app-clipboard');
    if (clipBtn) {
      const app = getEffectiveApps(data)[Number(clipBtn.dataset.appIndex)];
      const ok = await copyToClipboard(data.subUrl);
      if (ok && app) showToast(t('clipboardHint')(app.name));
      return;
    }
    const deepBtn = e.target.closest('.js-app-deeplink');
    if (deepBtn) {
      const app = getEffectiveApps(data)[Number(deepBtn.dataset.appIndex)];
      if (!app) return;
      const name = encodeURIComponent(CONFIG.brand.name || 'Sub');
      let url = app.importUrl.replace('{url}', encodeURIComponent(data.subUrl)).replace('{name}', name);
      // Panel-provided import_url is meant to already have {url} substituted
      // server-side — but if it somehow still has the literal placeholder
      // (older panel version, or opened outside a real render), fall back
      // to substituting it ourselves so the button still works.
      if (url.includes('{url}')) url = url.replace('{url}', encodeURIComponent(data.subUrl));
      tryOpenApp(url, () => showToast(t('appNotInstalled')(app.name)));
    }
  });

  el('#copyLinkBtn').addEventListener('click', async () => {
    const ok = await copyToClipboard(data.subUrl);
    if (ok) { showToast(t('copied')); if (navigator.vibrate) navigator.vibrate(12); }
  });
  el('#copyAllBtn').addEventListener('click', async () => {
    const all = data.configs.map((c) => c.raw).filter(Boolean).join('\n');
    const ok = await copyToClipboard(all);
    if (ok) { showToast(t('copiedAll')(data.configs.length)); if (navigator.vibrate) navigator.vibrate(12); }
  });
  el('#qrLinkBtn').addEventListener('click', () => openQrModal(data.subUrl));
  el('#qrModalClose').addEventListener('click', closeQrModal);
  el('#qrModal').addEventListener('click', (e) => { if (e.target.id === 'qrModal') closeQrModal(); });

  el('#serverSearch').addEventListener('input', (e) => { searchQuery = e.target.value; renderServerList(data); });

  el('#serverList').addEventListener('click', async (e) => {
    const row = e.target.closest('.server-row');
    if (!row) return;
    const idx = Number(row.dataset.idx);
    const cfg = data.configs[idx];
    if (e.target.closest('.js-copy-config')) {
      const ok = await copyToClipboard(cfg.raw || '');
      if (ok) showToast(t('copied'));
    } else if (e.target.closest('.js-qr-config')) {
      openQrModal(cfg.raw || '');
    } else if (e.target.closest('.js-details')) {
      const panel = el('#details-' + idx);
      if (!panel.dataset.filled) { panel.innerHTML = detailsMarkup(cfg); panel.dataset.filled = '1'; }
      panel.classList.toggle('hidden');
    }
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeQrModal(); });
}


/* ================================ 9) Boot =================================== */
async function boot() {
  applyTheme(CONFIG.theme.default === 'light' ? 'light' : 'dark');
  applyLanguage(lang);
  renderBrand();
  ensureRingShells(); // show the ring skeleton immediately instead of a blank gap while data loads
  const data = await loadSubscriptionData();
  currentData = data;
  renderAll(data);
  wireEvents(data);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

</script>
